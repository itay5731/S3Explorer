name: Build executables

# Tauri cannot cross-compile, so each OS builds its own binary.
#
# - Push a tag like v0.3.0: builds every platform, then publishes a GitHub Release whose text
#   is that version's section of CHANGELOG.md, with the executables and installers attached.
#   A tag with a hyphen (v0.3.0-rc.1) is published as a pre-release.
# - Run manually without a tag: builds only, downloadable as workflow artifacts.
# - Run manually with an existing tag (e.g. v0.1.0): builds that tag and publishes its Release,
#   taking the notes from CHANGELOG.md on the branch the workflow is run from.
#
# In-app updates: when the repository secret TAURI_SIGNING_PRIVATE_KEY is set, signed update
# packages and a latest.json manifest are published too. See .claude/rules/updater.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish as a Release (leave empty to only build)"
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Keep in sync with src-tauri/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      # Update packages for the in-app updater are produced and signed only when the signing key
      # secret exists. Without it the build is identical minus those files.
      - name: Build app
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "Signing key present: building signed update packages"
            export TAURI_SIGNING_PRIVATE_KEY="$SIGNING_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
            npm run tauri build -- --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY is not set: building without signed update packages"
            npm run tauri build -- --target ${{ matrix.target }}
          fi

      - name: Upload executable and installers
        uses: actions/upload-artifact@v4
        with:
          name: s3explorer-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/s3explorer
            src-tauri/target/${{ matrix.target }}/release/s3explorer.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig

  release:
    name: Publish release with patch notes
    needs: build
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      # For a tag push this is the tagged commit; for a manual run it is the branch the run was
      # started from, so older tags can be published with notes written later.
      - uses: actions/checkout@v4

      - name: Extract patch notes for this version from CHANGELOG.md
        run: |
          version="${TAG#v}"
          extract() {
            awk -v ver="$1" '
              /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1; next } }
              found { print }
            ' CHANGELOG.md
          }
          extract "$version" > notes.md
          # A pre-release (v0.3.0-rc.1) may reuse the notes of its base version, or of [Unreleased].
          if ! grep -q '[^[:space:]]' notes.md && [ "$version" != "${version%%-*}" ]; then
            extract "${version%%-*}" > notes.md
            grep -q '[^[:space:]]' notes.md || extract "Unreleased" > notes.md
          fi
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for [$version]. Add patch notes before releasing."
            exit 1
          fi
          echo "----- patch notes for $TAG -----"
          cat notes.md

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files and give each a platform-specific name
        run: |
          mkdir release
          for dir in artifacts/s3explorer-*; do
            platform="${dir#artifacts/s3explorer-}"
            find "$dir" -type f | while read -r file; do
              base="$(basename "$file")"
              case "$base" in
                s3explorer)        dest="s3explorer-${TAG}-${platform}" ;;
                s3explorer.exe)    dest="s3explorer-${TAG}-${platform}.exe" ;;
                # The macOS update package has the same file name on both architectures.
                *.app.tar.gz)      dest="S3.Explorer_${TAG#v}_${platform}.app.tar.gz" ;;
                *.app.tar.gz.sig)  dest="S3.Explorer_${TAG#v}_${platform}.app.tar.gz.sig" ;;
                *)                 dest="$(printf '%s' "$base" | tr ' ' '.')" ;;
              esac
              if [ -e "release/$dest" ]; then
                echo "::error::Two files would both be published as $dest"
                exit 1
              fi
              cp "$file" "release/$dest"
            done
          done
          ls -la release

      # latest.json is what the in-app updater reads. It is written only when every platform has
      # a signed update package; otherwise the app still tells users about the new version and
      # sends them to the download page.
      - name: Write the updater manifest (latest.json)
        run: node .github/scripts/write-latest-json.cjs release notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: S3 Explorer ${{ env.TAG }}
          body_path: notes.md
          files: release/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(env.TAG, '-') }}
